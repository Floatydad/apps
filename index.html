<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Apps in the Sky</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Web apps built by Mick and friends.">
<meta name="theme-color" content="#7FB6E8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E1630" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="icon" href="favicon.png" type="image/png" sizes="64x64">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-title" content="Apps">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&display=swap">
<style>
/* Layout: one phone-width column in an open sky — a lock-screen clock, then frosted panels holding iOS-style icon grids. */
:root {
  --sky-top: #6FA8E0;
  --sky-mid: #A9D0F2;
  --sky-low: #EAF4FB;
  --cloud: rgba(255, 255, 255, 0.75);
  --glass: rgba(255, 255, 255, 0.42);
  --glass-edge: rgba(255, 255, 255, 0.7);
  --ink: #12304F;
  --ink-soft: #3F5F80;
  --clock: #FFFFFF;
  --clock-shadow: rgba(30, 70, 120, 0.25);
  --focus: #12304F;
  --star: rgba(255, 255, 255, 0);
  --display: "Bricolage Grotesque", ui-rounded, "SF Pro Rounded", system-ui, sans-serif;
  --body: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --sky-top: #070C1F; --sky-mid: #142247; --sky-low: #2B3D6B;
    --cloud: rgba(170, 190, 235, 0.10);
    --glass: rgba(20, 32, 66, 0.55); --glass-edge: rgba(160, 185, 240, 0.18);
    --ink: #EAF0FF; --ink-soft: #A8B6D8;
    --clock: #F4F7FF; --clock-shadow: rgba(0, 0, 0, 0.4);
    --focus: #F4F7FF; --star: rgba(255, 255, 255, 0.85);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --sky-top: #070C1F; --sky-mid: #142247; --sky-low: #2B3D6B;
  --cloud: rgba(170, 190, 235, 0.10);
  --glass: rgba(20, 32, 66, 0.55); --glass-edge: rgba(160, 185, 240, 0.18);
  --ink: #EAF0FF; --ink-soft: #A8B6D8;
  --clock: #F4F7FF; --clock-shadow: rgba(0, 0, 0, 0.4);
  --focus: #F4F7FF; --star: rgba(255, 255, 255, 0.85);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { min-height: 100%; background: var(--sky-top); }
body {
  margin: 0;
  min-height: 100vh;
  min-height: 100dvh;
  font-family: var(--body);
  color: var(--ink);
  background: linear-gradient(180deg, var(--sky-top) 0%, var(--sky-mid) 55%, var(--sky-low) 100%) fixed, var(--sky-top);
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
  overflow-x: hidden;
}

/* Clouds (by day) and stars (by night), painted behind everything. */
.sky { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
.cloud {
  position: absolute; border-radius: 50%;
  background: radial-gradient(closest-side, var(--cloud), transparent);
  filter: blur(6px);
  animation: drift 90s linear infinite;
}
.cloud.c1 { width: 340px; height: 120px; top: 7%;  left: -10%; }
.cloud.c2 { width: 260px; height: 90px;  top: 30%; left: 55%; animation-duration: 120s; animation-delay: -40s; }
.cloud.c3 { width: 420px; height: 140px; top: 62%; left: -20%; animation-duration: 150s; animation-delay: -80s; }
.cloud.c4 { width: 220px; height: 80px;  top: 85%; left: 60%; animation-duration: 110s; animation-delay: -20s; }
@keyframes drift { from { transform: translateX(-30vw); } to { transform: translateX(60vw); } }
.stars {
  position: absolute; inset: 0;
  background-image:
    radial-gradient(1px 1px at 12% 8%, var(--star), transparent),
    radial-gradient(1px 1px at 78% 14%, var(--star), transparent),
    radial-gradient(1.5px 1.5px at 40% 22%, var(--star), transparent),
    radial-gradient(1px 1px at 88% 40%, var(--star), transparent),
    radial-gradient(1px 1px at 22% 48%, var(--star), transparent),
    radial-gradient(1.5px 1.5px at 62% 6%, var(--star), transparent),
    radial-gradient(1px 1px at 6% 30%, var(--star), transparent),
    radial-gradient(1px 1px at 52% 36%, var(--star), transparent);
}

.screen {
  position: relative; z-index: 1;
  max-width: 460px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: calc(28px + env(safe-area-inset-top, 0px)) calc(40px + env(safe-area-inset-bottom, 0px));
  display: flex; flex-direction: column; gap: 22px;
}

/* Lock-screen clock */
.lock { text-align: center; color: var(--clock); text-shadow: 0 2px 18px var(--clock-shadow); padding-block: 8px 6px; }
.date { font-family: var(--body); font-size: 1.05rem; font-weight: 600; letter-spacing: 0.01em; opacity: 0.95; }
.time {
  font-family: var(--display); font-weight: 700;
  font-size: clamp(4.5rem, 24vw, 6.5rem); line-height: 0.95; letter-spacing: -0.03em;
  font-variant-numeric: tabular-nums;
}

/* Frosted panels */
.panel {
  background: var(--glass);
  border: 1px solid var(--glass-edge);
  border-radius: 28px;
  padding: 16px 12px 18px;
  -webkit-backdrop-filter: blur(22px) saturate(160%);
  backdrop-filter: blur(22px) saturate(160%);
  box-shadow: 0 10px 30px rgba(20, 50, 90, 0.10);
}
.panel h2 {
  margin: 0 6px 14px;
  font-family: var(--display); font-weight: 700; font-size: 0.8rem;
  text-transform: uppercase; letter-spacing: 0.12em;
  color: var(--ink-soft);
}
.grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); row-gap: 18px; column-gap: 6px; }

/* App icons */
.app {
  display: flex; flex-direction: column; align-items: center; gap: 7px;
  text-decoration: none; color: var(--ink); min-width: 0;
  border-radius: 18px; padding: 2px;
  transition: transform 0.15s ease;
}
.app:active { transform: scale(0.9); }
.app:focus-visible { outline: 2px solid var(--focus); outline-offset: 3px; }
.icon {
  position: relative; width: 100%; max-width: 64px; aspect-ratio: 1;
  border-radius: 22.5%; overflow: hidden;
  box-shadow: 0 4px 12px rgba(10, 30, 60, 0.18), inset 0 0 0 0.5px rgba(0, 0, 0, 0.08);
  background: #FFFFFF;
}
.icon img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.icon .letter {
  position: absolute; inset: 0; display: grid; place-items: center;
  font-family: var(--display); font-weight: 700; font-size: 1.7rem; color: #FFFFFF;
  background: linear-gradient(160deg, var(--a, #6FA8E0), var(--b, #2F5F9E));
  text-shadow: 0 1px 2px rgba(0, 0, 0, 0.2);
}
.label {
  display: flex; flex-direction: column; align-items: center;
  font-size: 0.72rem; font-weight: 500; line-height: 1.2; text-align: center;
  max-width: 100%;
}
.label span { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.label .name { white-space: normal; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow-wrap: anywhere; }
.label .by { color: var(--ink-soft); }

.empty { margin: 0 6px; font-size: 0.9rem; line-height: 1.45; color: var(--ink-soft); }


@media (prefers-reduced-motion: reduce) {
  .cloud { animation: none; }
  .app { transition: none; }
}
</style>
</head>
<body>
<div class="sky" aria-hidden="true">
  <div class="stars"></div>
  <div class="cloud c1"></div><div class="cloud c2"></div><div class="cloud c3"></div><div class="cloud c4"></div>
</div>

<main class="screen">
  <header class="lock">
    <div class="date" id="date">Thursday 15 October</div>
    <div class="time" id="time">9:41</div>
  </header>
  <div id="sections"></div>
</main>

<script>
/*
  To add an app, add a line to the right section below.
    name:  the label under the icon (keep it short)
    by:    optional. Who built it, shown in brackets under the name
    url:   where the icon goes
    icon:  optional. A direct link to the app's icon. If left out, the page
           looks for the usual icon files on the app's own site.
    color: optional. Two colours for the lettered tile used when no icon is found.
*/
const SECTIONS = [
  {
    title: "Mick's apps",
    apps: [
      { name: "Bogha Baisti", url: "https://boghabaisti.com/",                color: ["#4FA37A", "#1F6A55"] },
      { name: "Four Sugars",  url: "https://foursugarsplease.com/",           icon: "https://foursugarsplease.com/icons/apple-touch-icon.png", color: ["#8A4B2A", "#4A2511"] },
      { name: "Season Tickets", url: "https://season-tickets.grazers-savanna-4p.workers.dev/", icon: "icons/season-tickets.png", color: ["#B3152B", "#7A0E1D"] },
      { name: "Piano",        url: "https://floatydad.github.io/music-quiz/", color: ["#3A3A4A", "#0E0E16"] },
    ],
  },
  {
    title: "Friends' apps",
    apps: [
      { name: "FPL",      by: "Stef",  url: "https://beta.and-its.live/league/1258587", color: ["#37E28A", "#3D0D52"] },
      { name: "Geology",  by: "Niall", url: "https://geomap.tigduv.com/",               color: ["#C9A36B", "#6B4E2E"] },
      { name: "Gigs",     by: "Niall", url: "https://eventsonar.app/",                  color: ["#FF6A88", "#7B2FF7"] },
      { name: "Planning", by: "Niall", url: "https://snoop.tigduv.com/",                color: ["#F5B041", "#C0392B"] },
    ],
  },
  {
    title: "Others",
    apps: [],
    empty: "Later …",
  },
];

// ---- Clock ----
function tick() {
  const now = new Date();
  document.getElementById("time").textContent =
    now.toLocaleTimeString("en-GB", { hour: "numeric", minute: "2-digit" });
  document.getElementById("date").textContent =
    now.toLocaleDateString("en-GB", { weekday: "long", day: "numeric", month: "long" });
}
tick();
setInterval(tick, 10000);

// ---- Icons ----
function store(key, value) {
  try { if (value === undefined) return localStorage.getItem(key); localStorage.setItem(key, value); } catch (e) { return null; }
}

function iconCandidates(app) {
  const u = new URL(app.url);
  const dir = u.href.split(/[?#]/)[0].replace(/[^/]*$/, "");
  const list = [
    app.icon,
    store("icon:" + app.url),
    dir + "apple-touch-icon.png",
    dir + "icons/apple-touch-icon.png",
    dir + "icon-192.png",
    dir + "icons/icon-192.png",
    u.origin + "/apple-touch-icon.png",
    u.origin + "/apple-touch-icon-precomposed.png",
    u.origin + "/icons/apple-touch-icon.png",
    u.origin + "/icon-192.png",
    u.origin + "/icons/icon-192.png",
    u.origin + "/logo192.png",
    u.origin + "/icon.svg",
    u.origin + "/favicon.svg",
    "https://www.google.com/s2/favicons?sz=128&domain=" + u.hostname,
  ];
  return [...new Set(list.filter(Boolean))];
}

// Try each likely icon address in turn; keep the lettered tile if none load.
function loadIcon(app, box) {
  const tries = iconCandidates(app);
  let i = 0;
  const next = () => {
    if (i >= tries.length) return;
    const src = tries[i++];
    const img = new Image();
    img.alt = "";
    img.decoding = "async";
    img.referrerPolicy = "no-referrer";
    img.onload = () => {
      const isSvg = /\.svg(\?|$)/.test(src);
      if (!isSvg && img.naturalWidth < 32) return next();
      box.appendChild(img);
      store("icon:" + app.url, src);
    };
    img.onerror = next;
    img.src = src;
  };
  next();
}

// ---- Build the screen ----
const root = document.getElementById("sections");
root.style.display = "flex";
root.style.flexDirection = "column";
root.style.gap = "18px";

for (const section of SECTIONS) {
  const panel = document.createElement("section");
  panel.className = "panel";
  const h = document.createElement("h2");
  h.textContent = section.title;
  panel.appendChild(h);

  if (section.apps.length === 0) {
    const p = document.createElement("p");
    p.className = "empty";
    p.innerHTML = section.empty || "Nothing here yet.";
    panel.appendChild(p);
  } else {
    const grid = document.createElement("div");
    grid.className = "grid";
    const sorted = [...section.apps].sort((x, y) => x.name.localeCompare(y.name, "en", { sensitivity: "base" }));
    for (const app of sorted) {
      const a = document.createElement("a");
      a.className = "app";
      a.href = app.url;
      a.target = "_blank";
      a.rel = "noopener";
      a.setAttribute("aria-label", app.by ? `${app.name} (${app.by})` : app.name);

      const box = document.createElement("div");
      box.className = "icon";
      const letter = document.createElement("div");
      letter.className = "letter";
      letter.textContent = app.name.replace(/^[^A-Za-z0-9]+/, "").charAt(0).toUpperCase();
      if (app.color) {
        letter.style.setProperty("--a", app.color[0]);
        letter.style.setProperty("--b", app.color[1]);
      }
      box.appendChild(letter);

      const label = document.createElement("span");
      label.className = "label";
      const nameEl = document.createElement("span");
      nameEl.className = "name";
      nameEl.textContent = app.name;
      label.appendChild(nameEl);
      if (app.by) {
        const byEl = document.createElement("span");
        byEl.className = "by";
        byEl.textContent = `(${app.by})`;
        label.appendChild(byEl);
      }

      a.append(box, label);
      grid.appendChild(a);
      loadIcon(app, box);
    }
    panel.appendChild(grid);
  }
  root.appendChild(panel);
}
</script>
</body>
</html>
